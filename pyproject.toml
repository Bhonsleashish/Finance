[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-os"
version = "0.1.0"
description = "A local-first, offline personal finance operating system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private" }
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "plotly>=5.22",
    "streamlit>=1.36",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "python-dateutil>=2.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
finance = "finance_os.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
